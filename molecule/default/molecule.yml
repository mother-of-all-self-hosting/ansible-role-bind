---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: bind-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        bind_debug_service_enabled: false

        # Variables for BIND
        #
        # The user and group are deliberately left at the role's defaults (53:53)
        # instead of being overridden. The container image's entrypoint always
        # execs `named -u bind`, and the container runs with `--cap-drop=ALL`, so
        # `named` can only complete that `setgid()`/`setuid()` when it is already
        # running as `bind` (53:53). Any other value makes it exit with
        # `setgid(): Operation not permitted` before it reads its configuration.
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
